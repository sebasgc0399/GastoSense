<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GastoSense — Design System v2.1.1</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>

<body>
  <button id="theme-toggle" class="theme-switch" aria-label="Cambiar tema" type="button">
    <span class="icon-moon" aria-hidden="true">◑</span>
  </button>

  <main class="main-container">
    <header>
      <div class="badge">DESIGN SYSTEM v2.1.1</div>
      <h1>Premium Glass UI</h1>
      <p class="subtitle">Componentes normalizados de alta fidelidad.</p>
    </header>

    <section class="glass-panel">
      <div class="row">
        <div class="label-group">
          <span class="label">Primario</span>
          <span class="desc">Acción principal</span>
        </div>
        <button class="btn btn-primary" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          Registrar nuevo
        </button>
      </div>

      <div class="row">
        <div class="label-group">
          <span class="label">Secundario</span>
          <span class="desc">Navegación / Alternativa</span>
        </div>
        <button class="btn btn-secondary" type="button">
          Editar presupuestos
        </button>
      </div>

      <div class="row">
        <div class="label-group">
          <span class="label">Ghost</span>
          <span class="desc">Baja prioridad</span>
        </div>
        <button class="btn btn-ghost" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Plantilla Excel
        </button>
      </div>

      <div class="row">
        <div class="label-group">
          <span class="label">Destructivo</span>
          <span class="desc">Irreversible</span>
        </div>
        <button class="btn btn-danger" type="button">
          Eliminar
        </button>
      </div>

      <div class="row">
        <div class="label-group">
          <span class="label">Deshabilitado</span>
          <span class="desc">Estado de carga</span>
        </div>
        <button class="btn btn-primary" type="button" disabled>
          Procesando…
        </button>
      </div>
    </section>

    <section class="palette-section">
      <div class="swatch s-brand">Brand</div>
      <div class="swatch s-surface">Surface</div>
      <div class="swatch s-bg">Background</div>
      <div class="swatch s-danger">Danger</div>
    </section>
  </main>

  <script>
    const root = document.documentElement;
    const toggle = document.getElementById("theme-toggle");

    const savedTheme =
      localStorage.getItem("theme") ||
      (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");

    root.setAttribute("data-theme", savedTheme);

    toggle.addEventListener("click", () => {
      const current = root.getAttribute("data-theme");
      const next = current === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      localStorage.setItem("theme", next);
    });
  </script>
</body>
</html>
